<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>거울</title>
    <style>
        * { margin: 0; padding: 0; background-color: #000; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; position: relative; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
        
        /* 반전 스타일 */
        .flipped { transform: scaleX(-1); }

        /* 촬영 버튼 스타일 */
        .btn-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }
        .capture-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 4px solid #fff;
            background-color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .capture-btn:active {
            background-color: rgba(255, 255, 255, 0.8);
            transform: scale(0.95);
        }
        .inner-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <!-- 카메라 화면 (터치 시 반전) -->
    <video id="mirror" autoplay playsinline onclick="toggleFlip()"></video>

    <!-- 촬영 버튼 -->
    <div class="btn-container">
        <button class="capture-btn" onclick="takePhoto()">
            <div class="inner-circle"></div>
        </button>
    </div>

    <!-- 캡처용 캔버스 (숨김 처리) -->
    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('mirror');
        const canvas = document.getElementById('canvas');

        // 화면 터치 시 반전 전환
        function toggleFlip() {
            video.classList.toggle('flipped');
        }

        // 사진 촬영 및 다운로드
        function takePhoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // 반전 상태 그대로 사진에 반영
            if (video.classList.contains('flipped')) {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }

            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 이미지 파일 생성 및 다운로드
            const image = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = image;
            link.download = `mirror_${Date.now()}.png`;
            link.click();
        }

        // 카메라 시작
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
        })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert("카메라 권한을 허용해 주세요."); });
    </script>
</body>
</html>
