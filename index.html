<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>거울</title>
    <style>
        * { margin: 0; padding: 0; background-color: #000; }
        body, html { width: 100%; height: 100%; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100vw; height: 100vh; object-fit: cover; }
    </style>
</head>
<body>
    <video id="mirror" autoplay playsinline></video>
    <script>
        const video = document.getElementById('mirror');
        navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } },
            audio: false
        })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert("카메라 권한을 허용해 주세요."); });
    </script>
</body>
</html>
