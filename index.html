<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>거울</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            background-color: #000;
            position: relative;
        }
        
        video { 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            transition: transform 0.2s ease-in-out;
        }

        /* 좌우 반전 처리 */
        .flipped {
            transform: scaleX(-1);
        }

        /* 전환 시 줌 배율 (기존 1.3배 -> 1.15배로 자연스럽게 감소) */
        .zoom-in {
            transform: scale(1.15);
        }
        .zoom-in.flipped {
            transform: scale(-1.15, 1.15);
        }

        /* 하단 조작 버튼 (완전 투명) */
        .controls {
            position: absolute;
            bottom: calc(25px + env(safe-area-inset-bottom));
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            z-index: 10;
            background: transparent !important;
        }

        /* 화각 전환 버튼 */
        .btn {
            background-color: rgba(0, 0, 0, 0.4);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn:active {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }

        /* 촬영 버튼 */
        .capture-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid #fff;
            background-color: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .capture-btn:active {
            transform: scale(0.92);
            background-color: rgba(255, 255, 255, 0.7);
        }
        .inner-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <video id="mirror" autoplay playsinline onclick="toggleFlip()"></video>

    <div class="controls">
        <button class="btn" onclick="toggleZoom()" id="zoomBtn">화각 전환</button>
        
        <button class="capture-btn" onclick="takePhoto()">
            <div class="inner-circle"></div>
        </button>

        <div style="width: 70px;"></div>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('mirror');
        const canvas = document.getElementById('canvas');
        const zoomBtn = document.getElementById('zoomBtn');
        let videoTrack = null;

        // 카메라 권한 및 스트림 연결
        navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: "user",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        })
        .then(stream => { 
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            
            // 하드웨어 줌 최소화 고정
            if (videoTrack && videoTrack.getCapabilities) {
                const capabilities = videoTrack.getCapabilities();
                if (capabilities.zoom) {
                    videoTrack.applyConstraints({
                        advanced: [{ zoom: capabilities.zoom.min || 1 }]
                    }).catch(e => console.log(e));
                }
            }
        })
        .catch(err => { alert("카메라 권한을 허용해 주세요."); });

        // 화각 전환 (1.0배 ↔ 1.15배)
        function toggleZoom() {
            if (video.classList.contains('zoom-in')) {
                video.classList.remove('zoom-in');
            } else {
                video.classList.add('zoom-in');
            }
        }

        // 화면 터치 시 좌우 반전
        function toggleFlip() {
            video.classList.toggle('flipped');
        }

        // 사진 촬영 및 저장
        function takePhoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            context.save();
            if (video.classList.contains('flipped')) {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }

            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            context.restore();

            const image = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = image;
            link.download = `mirror_${Date.now()}.png`;
            link.click();
        }
    </script>
</body>
</html>
