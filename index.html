<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>거울</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative;
            background-color: #000;
        }
        
        video { 
            width: 100vw; 
            height: 100vh; 
            object-fit: cover; 
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 좌우 반전 처리 */
        .flipped {
            transform: scaleX(-1);
        }

        /* 하단 조작 버튼 레이아웃 (배경 투명화) */
        .controls {
            position: absolute;
            bottom: calc(25px + env(safe-area-inset-bottom));
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            z-index: 10;
            background: transparent;
        }

        /* 화각 전환 버튼 (반투명 유릿장 스타일) */
        .btn {
            background-color: rgba(0, 0, 0, 0.35);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .btn:active {
            background-color: rgba(255, 255, 255, 0.3);
            transform: scale(0.95);
        }

        /* 촬영 버튼 */
        .capture-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 4px solid #fff;
            background-color: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .capture-btn:active {
            transform: scale(0.92);
            background-color: rgba(255, 255, 255, 0.7);
        }
        .inner-circle {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <video id="mirror" autoplay playsinline onclick="toggleFlip()"></video>

    <div class="controls">
        <button class="btn" onclick="toggleZoom()" id="zoomBtn">화각 전환</button>
        
        <button class="capture-btn" onclick="takePhoto()">
            <div class="inner-circle"></div>
        </button>

        <div style="width: 70px;"></div>
    </div>

    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('mirror');
        const canvas = document.getElementById('canvas');
        let videoTrack = null;
        let isWide = true;

        // 카메라 권한 및 스트림 연결
        navigator.mediaDevices.getUserMedia({
            video: { 
                facingMode: "user", 
                width: { ideal: 3840 }, 
                height: { ideal: 2160 } 
            },
            audio: false
        })
        .then(stream => { 
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
            
            // 초기 설정: 하드웨어 최소 줌 시도
            applyHardwareZoom(true);
        })
        .catch(err => { alert("카메라 권한을 허용해 주세요."); });

        // 하드웨어 렌즈 줌 조절 함수
        function applyHardwareZoom(wide) {
            if (!videoTrack) return;
            const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
            
            if (capabilities.zoom) {
                const minZoom = capabilities.zoom.min || 1;
                const maxZoom = capabilities.zoom.max || 1;
                const targetZoom = wide ? minZoom : minZoom + (maxZoom - minZoom) * 0.25;
                
                videoTrack.applyConstraints({
                    advanced: [{ zoom: targetZoom }]
                }).catch(e => console.log("하드웨어 줌 적용 불가"));
            }
        }

        // 화각 전환 버튼 눌렀을 때
        function toggleZoom() {
            isWide = !isWide;
            applyHardwareZoom(isWide);
        }

        // 화면 터치 시 좌우 반전
        function toggleFlip() {
            video.classList.toggle('flipped');
        }

        // 사진 촬영
        function takePhoto() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            context.save();
            if (video.classList.contains('flipped')) {
                context.translate(canvas.width, 0);
                context.scale(-1, 1);
            }

            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            context.restore();

            const image = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = image;
            link.download = `mirror_${Date.now()}.png`;
            link.click();
        }
    </script>
</body>
</html>
